version: '3.8'

services:
  # Database - Using Supabase Cloud or local PostgreSQL
  # Note: For full Supabase features, use Supabase Cloud
  # This is a simplified PostgreSQL for development
  
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loan-approval-backend
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CORS_ORIGINS=http://localhost:3000
      - MODEL_PATH=/app/ml-model/models
      - DATA_PATH=/app/ml-model/data
      - LOG_LEVEL=INFO
    volumes:
      - ./backend:/app/backend
      - ./ml-model:/app/ml-model
      - ./middleware:/app/middleware
      - ./database:/app/database
    depends_on:
      - db
    networks:
      - loan-approval-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loan-approval-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_APP_NAME=Home Credit Loan Approval
    depends_on:
      - backend
    networks:
      - loan-approval-network
    restart: unless-stopped

  # PostgreSQL (if not using Supabase Cloud)
  db:
    image: postgres:15-alpine
    container_name: loan-approval-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=loan_approval
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/supabase/migrations:/docker-entrypoint-initdb.d
    networks:
      - loan-approval-network
    restart: unless-stopped

networks:
  loan-approval-network:
    driver: bridge

volumes:
  postgres_data:
