# Model Configuration

# TabNet Hyperparameters
tabnet:
  n_d: 64
  n_a: 64
  n_steps: 5
  gamma: 1.5
  n_independent: 2
  n_shared: 2
  lambda_sparse: 0.0001
  learning_rate: 0.02
  max_epochs: 200
  patience: 50
  batch_size: 1024
  virtual_batch_size: 128

# Bayesian Network Configuration
bayesian_network:
  max_features: 20
  n_bins: 3
  score_method: 'bic'
  estimator: 'maximum_likelihood'

# Hybrid Ensemble Configuration
ensemble:
  meta_model: 'logistic_regression'
  voting: 'soft'

# Data Split Configuration
data_split:
  test_size: 0.2
  val_size: 0.1
  random_state: 42
  stratify: true

# Feature Engineering
feature_engineering:
  create_ratios: true
  create_aggregates: true
  create_interactions: true
  polynomial_degree: 2

# Training Configuration
training:
  random_seed: 42
  n_jobs: -1
  verbose: 1
  early_stopping: true
  
# Evaluation Metrics
metrics:
  - roc_auc
  - accuracy
  - precision
  - recall
  - f1_score

# Cross-validation
cross_validation:
  n_folds: 5
  shuffle: true
  random_state: 42
